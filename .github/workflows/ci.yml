name: CI

on:
  push:
    branches: ["main", "work"]
  pull_request:

jobs:
  harness-and-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python compile check
        run: python3 -m compileall harness scripts tests test_all.py
      - name: Unit tests
        run: python3 -m unittest discover
      - name: Verify reconciled study reports
        run: python3 scripts/analyze.py --check
      - name: Dry-run benchmark
        run: python3 harness/runner.py --dry-run --output-json results/generated/ci-raw.json --output-csv results/generated/ci-raw.csv
      - name: Redact dry-run public artifact
        run: python3 scripts/redact_public_results.py --input-json results/generated/ci-raw.json --output-json results/generated/ci-public.json --output-csv results/generated/ci-public.csv
      - name: Validate legacy harness output
        run: python3 scripts/validate_artifacts.py --legacy-results-json results/generated/ci-public.json --legacy-results-csv results/generated/ci-public.csv
      - name: Validate legacy output redaction
        run: python3 scripts/check_public_release.py --legacy-results-json results/generated/ci-public.json
      - name: Validate dataset and current study artifacts
        run: python3 scripts/validate_artifacts.py
      - name: Public release guard
        run: python3 scripts/check_public_release.py

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
